  backend:
    build: ./backend
    restart: always
    ports:
      - '8000:8000' # CHANGED from 8001 to match devcontainer.json
    volumes:
      - './backend:/var/www/html'
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=my_database
      - DB_USERNAME=dev_user
      - DB_PASSWORD=dev_password
    depends_on:
      - mysql

  frontend:
    build: ./frontend
    restart: always
    ports:
      - '5173:5173' # CHANGED from 3000 to match Vite/devcontainer.json
    volumes:
      - './frontend:/frontend'
      - /frontend/node_modules
    environment:
      - WATCHPACK_POLLING=true
      - 'VITE_CODESPACE_NAME=${CODESPACE_NAME}'
      - 'VITE_GITHUB_CODESPACES=${GITHUB_CODESPACES}'
    depends_on:
      - backend
